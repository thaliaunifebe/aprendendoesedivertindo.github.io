<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendendo e se Divertindo!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.10/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    .animate-bounce-slight { animation: bounceSlight 1s infinite; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounceSlight {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .capivara-cresce { animation: crescer 1.2s ease-out forwards; }
    @keyframes crescer {
      from { transform: scale(0.1); opacity: 0.5; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>
 
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useMemo } = React;
 
    // --- Ícones SVG embutidos ---
    const IconPlay = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    const IconStar = ({ size = 24, className = '' }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
    const IconArrowRight = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
    const IconCheck = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconRestart = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>;
    const IconSpeaker = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    );
 
    // --- Sequência Progressiva de Perguntas ---
    // "descricao" é o texto lido em voz alta
    const sequenciaDePerguntas = [
      // FÁCIL
      {nivel: 'Fácil', type: 'syllable', text: 'VA - ___', descricao: 'Escolha a sílaba que completa a palavra VACA.', options: ['CA', 'CO'], correct: 'CA', icon: 'facil/vaca.png' },
      {nivel: 'Fácil', type: 'syllable', text: 'RA - ___', descricao: 'Escolha a sílaba que completa a palavra RATO.', options: ['TO', 'TU'], correct: 'TO', icon: 'facil/rato.png' },
      {nivel: 'Fácil', type: 'syllable', text: 'SA - ___', descricao: 'Escolha a sílaba que completa a palavra SAPO.', options: ['PE', 'PO'], correct: 'PO', icon: 'facil/sapo.png' },
      {nivel: 'Fácil', type: 'color', text: 'Qual bolinha é da cor AMARELO?', descricao: 'Escolha a bolinha da cor amarela.', options: ['facil/amarelo.png', 'facil/azul.png', 'facil/verde.png'], correct: 'facil/amarelo.png', icon: null },
      {nivel: 'Fácil', type: 'color', text: 'Qual bolinha é da cor VERDE?', descricao: 'Escolha a bolinha da cor verde.', options: ['facil/rosa.png', 'facil/verde.png', 'facil/amarelo.png'], correct: 'facil/verde.png', icon: null },
      {nivel: 'Fácil', type: 'color', text: 'Qual bolinha é da cor AZUL?', descricao: 'Escolha a bolinha da cor azul.', options: ['facil/verde.png', 'facil/azul.png', 'facil/roxo.png'], correct: 'facil/azul.png', icon: null },
      {nivel: 'Fácil', type: 'habitat', text: 'Onde o Sapo mora?', descricao: 'Escolha o lugar onde o sapo mora.', options: ['facil/lagoa.png', 'facil/colmeia.png', 'facil/deserto.png'], correct: 'facil/lagoa.png', icon: 'facil/sapo.png' },
      {nivel: 'Fácil', type: 'habitat', text: 'Onde a Abelha mora?', descricao: 'Escolha o lugar onde a abelha mora.', options: ['facil/deserto.png', 'facil/lagoa.png', 'facil/colmeia.png'], correct: 'facil/colmeia.png', icon: 'facil/abelha.png' },
 
      // MÉDIO
      {nivel: 'Médio', type: 'syllable', text: 'SA - PA - ___', descricao: 'Escolha a sílaba que completa a palavra SAPATO.', options: ['TO', 'TA', 'TE'], correct: 'TO', icon: 'medio/sapato.png' },
      {nivel: 'Médio', type: 'syllable', text: 'CA - SA - ___', descricao: 'Escolha a sílaba que completa a palavra CASACO.', options: ['CA', 'CO', 'CI'], correct: 'CO', icon: 'medio/casaco.png' },
      {nivel: 'Médio', type: 'syllable', text: 'TA - PE - ___', descricao: 'Escolha a sílaba que completa a palavra TAPETE.', options: ['TA', 'TI', 'TE'], correct: 'TE', icon: 'medio/tapete.png' },
      {nivel: 'Médio', type: 'rima', text: 'O que rima com SABÃO?', descricao: 'Escolha a figura que rima com SABÃO.', options: ['medio/balao.png', 'medio/telha.png', 'medio/casa.png'], correct: 'medio/balao.png', icon: 'medio/sabao.png' },
      {nivel: 'Médio', type: 'ligue', text: 'Ligue os conjuntos com a mesma quantidade', descricao: 'Ligue os conjuntos que têm a mesma quantidade de bichinhos. Clique em uma figura da esquerda e depois na da direita.', pares: [{ a: 'medio/cachorro.png',   b: 'medio/tartaruga.png' }, { a: 'medio/borboletas.png',  b: 'medio/abelhas.png' }, { a: 'medio/joaninhas.png', b: 'medio/peixes.png' }], options: [], correct: 'ok', icon: null, fixo: true },
 
      // DIFÍCIL
      {nivel: 'Difícil', type: 'syllable', text: 'Selecione o animal atrás do patinho amarelinho', descricao: 'Escolha o animal que está atrás do patinho amarelinho.', options: ['dificil/tartaruga.png', 'dificil/pato.png', 'dificil/elefante.png', 'dificil/sapo.png'], correct: 'dificil/elefante.png', icon: null, fixo: true },
      {nivel: 'Difícil', type: 'syllable', text: 'Selecione a cena em que o macaco está atrás da árvore', descricao: 'Escolha a cena em que o macaco está atrás da árvore.', options: ['dificil/macacoladoarvore.png', 'dificil/macacofrentearvore.png', 'dificil/macacotrasarvore.png'], correct: 'dificil/macacotrasarvore.png', icon: 'dificil/macaco.png' },
      {nivel: 'Difícil', type: 'syllable', text: 'Selecione a cena em que o macaco está na frente da árvore', descricao: 'Escolha a cena em que o macaco está na frente da árvore.', options: ['dificil/macacofrentearvore.png', 'dificil/macacotrasarvore.png', 'dificil/macacoladoarvore.png'], correct: 'dificil/macacofrentearvore.png', icon: 'dificil/macaco.png' },
      {nivel: 'Difícil', type: 'syllable', text: 'Selecione a cena em que o macaco está ao lado da árvore', descricao: 'Escolha a cena em que o macaco está ao lado da árvore.', options: ['dificil/macacotrasarvore.png', 'dificil/macacoladoarvore.png', 'dificil/macacofrentearvore.png'], correct: 'dificil/macacoladoarvore.png', icon: 'dificil/macaco.png' },
      {nivel: 'Difícil', type: 'syllable', text: 'E - LE - FAN - ___', descricao: 'Escolha a sílaba que completa a palavra ELEFANTE.', options: ['TE', 'TA', 'TI', 'TU'], correct: 'TE', icon: 'dificil/elefante.png' },
      {nivel: 'Difícil', type: 'syllable', text: 'BI - CI - CLE - ___', descricao: 'Escolha a sílaba que completa a palavra BICICLETA.', options: ['TA', 'DA', 'TE', 'BO'], correct: 'TA', icon: 'dificil/bike.png' },
 
      // EXPERT
      {nivel: 'Expert', type: 'contagem', text: 'Contando as figuras', descricao: 'Conte quantas figuras tem na imagem e escolha o número certo.', options: ['3', '4', '5'], correct: '3', icon: 'expert/saposconta.png', fixo: true },
      {nivel: 'Expert', type: 'contagem', text: 'Contando as figuras', descricao: 'Conte quantas figuras tem na imagem e escolha o número certo.', options: ['4', '6', '8'], correct: '6', icon: 'expert/macacosconta.png', fixo: true },
      {nivel: 'Expert', type: 'contagem', text: 'Contando as figuras', descricao: 'Conte quantas figuras tem na imagem e escolha o número certo.', options: ['1', '3', '5'], correct: '5', icon: 'expert/abelhasconta.png', fixo: true },
      {nivel: 'Expert', type: 'syllable', text: 'PA - RA - LE - LE - PÍ - ___ - ___ ', descricao: 'Escolha as duas sílabas que completam a palavra PARALELEPÍPEDO.', options: ['PE-DO', 'PE-DA', 'PI-DA', 'PO-DO'], correct: 'PE-DO', icon: 'expert/paralelepipedo.png' },
      {nivel: 'Expert', type: 'esconde', text: 'Ache a capivara', descricao: 'Procure a capivara escondida na paisagem e clique nela.', imagem: 'expert/paisagem.png',
        capivara: { img: 'expert/capivara.png', posicoes: [
          { x: 80, y: 68, w: 6 },
          { x: 12, y: 84, w: 6 },
          { x: 88, y: 82, w: 6 }
        ] },
        falsos: [
          { x: 0,  y: 55, w: 22, h: 45 },   // arbustos grandes embaixo à esquerda
          { x: 64, y: 60, w: 36, h: 40 },   // arbustos grandes embaixo à direita
          { x: 71, y: 67, w: 8,  h: 10 }    // arbusto pequeno na margem direita
        ], options: [], correct: 'capivara', icon: null }
    ].map((p, i) => ({ ...p, id: i + 1 }));
 
    const perguntaCapivara = sequenciaDePerguntas.find(p => p.type === 'esconde');
    const embaralhar = (lista) => [...lista].sort(() => Math.random() - 0.5);
 
    // --- Voz feminina suave (Web Speech API) ---
    const temVoz = () => 'speechSynthesis' in window;
    let vozEscolhida = null;
    let vozManual = null; // nome escolhido pela pessoa no seletor
    const norm = (v) => (v.lang || '').replace('_', '-').toLowerCase();
    const feminina = /francisca|thalita|luciana|fernanda|vit[oó]ria|camila|maria|helena|raquel|catarina|joana|google portugu[eê]s|\bfemale\b|feminin|woman|mulher/i;
    const masculina = /daniel|ant[oó]nio|felipe|ricardo|jorge|jo[aã]o|\bmale\b|masculin|\bman\b/i;
 
    const listarVozesPt = () => {
      if (!temVoz()) return [];
      const todas = window.speechSynthesis.getVoices().filter(v => norm(v).startsWith('pt'));
      // pt-BR primeiro, depois as vozes femininas
      return todas.sort((a, b) =>
        (norm(b) === 'pt-br') - (norm(a) === 'pt-br') ||
        (feminina.test(b.name) && !masculina.test(b.name)) - (feminina.test(a.name) && !masculina.test(a.name)));
    };
 
    const escolherVoz = () => {
      const lista = listarVozesPt();
      vozEscolhida =
        lista.find(v => v.name === vozManual) ||
        lista.find(v => feminina.test(v.name) && !masculina.test(v.name)) ||
        lista.find(v => !masculina.test(v.name)) ||
        lista[0] || null;
    };
 
    if (temVoz()) {
      escolherVoz();
      window.speechSynthesis.onvoiceschanged = escolherVoz;
    }
 
    const falarTexto = (texto, aoIniciar, aoTerminar) => {
      if (!temVoz()) return false;
      window.speechSynthesis.cancel();
      if (!vozEscolhida) escolherVoz();
      const fala = new SpeechSynthesisUtterance(texto);
      fala.lang = 'pt-BR';
      if (vozEscolhida) fala.voice = vozEscolhida;
      fala.rate = 0.85;   // devagar e calma, bom para crianças
      fala.pitch = 1.05;  // levemente mais agudo, mas sem exagero (suave)
      fala.volume = 0.9;
      if (aoIniciar) fala.onstart = aoIniciar;
      if (aoTerminar) {
        fala.onend = aoTerminar;
        fala.onerror = aoTerminar;
      }
      window.speechSynthesis.speak(fala);
      return true;
    };
 
    const SeletorVoz = () => {
      const [vozes, setVozes] = useState(listarVozesPt());
      const [nome, setNome] = useState(vozEscolhida ? vozEscolhida.name : '');
      useEffect(() => {
        const atualizar = () => { escolherVoz(); setVozes(listarVozesPt()); setNome(vozEscolhida ? vozEscolhida.name : ''); };
        atualizar();
        if (temVoz()) window.speechSynthesis.addEventListener('voiceschanged', atualizar);
        return () => { if (temVoz()) window.speechSynthesis.removeEventListener('voiceschanged', atualizar); };
      }, []);
      if (!vozes.length) return null;
      const mudar = (e) => {
        vozManual = e.target.value; setNome(vozManual); escolherVoz();
        falarTexto('Olá! Eu sou a voz que vai ajudar você no jogo.');
      };
      return (
        <div className="mb-6 flex flex-col items-center gap-2">
          <label className="text-gray-500 font-bold">Voz da narração:</label>
          <select value={nome} onChange={mudar} className="border-4 border-blue-200 rounded-2xl py-2 px-4 text-lg font-bold text-blue-700 bg-white">
            {vozes.map(v => <option key={v.name} value={v.name}>{v.name}</option>)}
          </select>
        </div>
      );
    };
 
    const BotaoAudio = ({ texto }) => {
      const [falando, setFalando] = useState(false);
      const falar = () => {
        const ok = falarTexto(texto, () => setFalando(true), () => setFalando(false));
        if (!ok) alert('Seu navegador não suporta áudio.');
      };
      return (
        <button
          onClick={falar}
          aria-label="Ouvir a instrução"
          className={`inline-flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white font-bold text-xl py-2 px-6 rounded-full shadow-md border-b-4 border-blue-700 transition hover:scale-105 active:scale-95 ${falando ? 'animate-bounce-slight' : ''}`}
        >
          <IconSpeaker size={28} /> Ouvir
        </button>
      );
    };
 
    const ForestBackground = ({ children }) => (
    <div
      className="min-h-screen relative overflow-hidden flex flex-col items-center justify-center p-4 font-sans selection:bg-[#B2D548]"
      style={{
        backgroundImage: "url('Backgroud.png')",
        backgroundSize: 'cover',
        backgroundPosition: 'center',
        backgroundRepeat: 'no-repeat'
      }}
    >
      <div className="relative z-10 w-full max-w-5xl flex justify-center">{children}</div>
    </div>
    );
 
    const CloudBox = ({ children, className = '' }) => (
      <div className={`bg-white rounded-[3rem] p-8 md:p-12 shadow-2xl border-8 border-white bg-opacity-95 text-center relative ${className}`}>
        {children}
      </div>
    );
 
    function CapivaraEscondida({ imagem, capivara, falsos, onErrar, onAchar }) {
      const [achou, setAchou] = useState(false);
 
      // depois de 3 segundos de comemoração, avisa o jogo
      useEffect(() => {
        if (!achou) return;
        const t = setTimeout(onAchar, 3000);
        return () => clearTimeout(t);
      }, [achou]);
 
      return (
        <div className="relative w-full mx-auto">
          <img src={imagem} alt="" className="block w-full rounded-3xl" />
 
          {falsos.map((f, i) => (
            <button
              key={i}
              onClick={onErrar}
              className="absolute rounded-3xl cursor-pointer"
              style={{ left: f.x + '%', top: f.y + '%', width: f.w + '%', height: f.h + '%' }}
            />
          ))}
 
          <button
            onClick={() => setAchou(true)}
            className="absolute cursor-pointer"
            style={{ left: capivara.x + '%', top: capivara.y + '%', width: capivara.w + '%' }}
          >
            <img src={capivara.img} alt="" className="block w-full" />
          </button>
 
          {achou && ReactDOM.createPortal(
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black bg-opacity-60 fade-in">
              <img src={capivara.img} alt="" className="capivara-cresce" style={{ width: '60vmin' }} />
              <p className="text-white text-5xl font-black mt-6 drop-shadow-lg">Você achou!</p>
            </div>,
            document.body
          )}
        </div>
      );
    }
 
    function LigueQuestao({ pares, onConcluir }) {
      // coluna da direita embaralhada (só uma vez)
      const [direita] = useState(() =>
        pares.map((p, i) => ({ id: i, img: p.b })).sort(() => Math.random() - 0.5)
      );
      const [selecionado, setSelecionado] = useState(null); // id escolhido na esquerda
      const [feitos, setFeitos] = useState([]);              // ids dos pares já ligados
      const [erro, setErro] = useState(null);                // id da direita que errou
 
      useEffect(() => {
        if (feitos.length === pares.length) {
          const t = setTimeout(onConcluir, 700);
          return () => clearTimeout(t);
        }
      }, [feitos]);
 
      const clicarEsquerda = (id) => {
        if (feitos.includes(id)) return;
        setSelecionado(id);
        setErro(null);
      };
 
      const clicarDireita = (id) => {
        if (selecionado === null || feitos.includes(id)) return;
        if (selecionado === id) {
          setFeitos([...feitos, id]);
          setSelecionado(null);
          setErro(null);
        } else {
          setErro(id);
          setSelecionado(null);
        }
      };
 
      const estilo = (id, escolhido, errado) =>
        'p-2 rounded-3xl border-4 transition transform hover:scale-105 ' +
        (feitos.includes(id) ? 'border-green-500 bg-green-100 opacity-70'
          : escolhido ? 'border-blue-500 bg-blue-100'
          : errado ? 'border-orange-400 bg-orange-100'
          : 'border-transparent bg-white');
 
      return (
        <div className="flex justify-center gap-16 w-full">
          <div className="flex flex-col gap-4">
            {pares.map((p, i) => (
              <button key={i} onClick={() => clicarEsquerda(i)} className={estilo(i, selecionado === i, false)}>
                <img src={p.a} alt="" className="h-24 object-contain rounded-2xl" />
              </button>
            ))}
          </div>
          <div className="flex flex-col gap-4">
            {direita.map((d) => (
              <button key={d.id} onClick={() => clicarDireita(d.id)} className={estilo(d.id, false, erro === d.id)}>
                <img src={d.img} alt="" className="h-24 object-contain rounded-2xl" />
              </button>
            ))}
          </div>
        </div>
      );
    }
 
    function App() {
      // Estados possíveis: 'START', 'PLAYING', 'FEEDBACK', 'LEVEL_UP', 'END'
      const [gameState, setGameState] = useState('START');
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [isCorrect, setIsCorrect] = useState(false);
      const [posCapivara, setPosCapivara] = useState(0);
 
      const pararAudio = () => { if (temVoz()) window.speechSynthesis.cancel(); };
 
      const startGame = () => {
        setCurrentIndex(0);
        setScore(0);
        setPosCapivara(Math.floor(Math.random() * perguntaCapivara.capivara.posicoes.length));
        setGameState('PLAYING');
      };
 
      const handleAnswer = (option) => {
        pararAudio(); // para o áudio ao responder
        const correct = option === sequenciaDePerguntas[currentIndex].correct;
        setIsCorrect(correct);
        if (correct) setScore(prev => prev + 10);
        setGameState('FEEDBACK');
      };
 
      const tentarNovamente = () => {
        setGameState('PLAYING');
      };
 
      const avancarPergunta = () => {
        if (currentIndex + 1 < sequenciaDePerguntas.length) {
          const nivelAtual = sequenciaDePerguntas[currentIndex].nivel;
          const proximoNivel = sequenciaDePerguntas[currentIndex + 1].nivel;
 
          if (nivelAtual !== proximoNivel) {
            setGameState('LEVEL_UP');
          } else {
            setCurrentIndex(prev => prev + 1);
            setGameState('PLAYING');
          }
        } else {
          setGameState('END');
        }
      };
 
      const irParaProximoNivel = () => {
        setCurrentIndex(prev => prev + 1);
        setGameState('PLAYING');
      };
 
      const acharCapivara = () => {
        setScore(prev => prev + 10);
        setGameState('END');
      };
 
      const getButtonColor = () => {
        return 'bg-purple-400 hover:bg-purple-500 border-purple-500 text-white';
      };
 
      const perguntaAtual = sequenciaDePerguntas[currentIndex];
      const opcoes = useMemo(() => perguntaAtual.fixo ? perguntaAtual.options : embaralhar(perguntaAtual.options), [currentIndex]);
      const nomesComAcento = { balao: 'Balão'};
      const nomeDaImagem = (caminho) => {
        const arquivo = caminho.split('/').pop().replace('.png', '');
        if (nomesComAcento[arquivo]) return nomesComAcento[arquivo];
        return arquivo.charAt(0).toUpperCase() + arquivo.slice(1);
      };
 
      // Se alguma imagem não carregar, mostra o nome dela no lugar
      useEffect(() => {
        const aoFalhar = (e) => {
          const img = e.target;
          if (img.tagName !== 'IMG' || img.dataset.falhou) return;
          img.dataset.falhou = '1';
          const nome = (img.getAttribute('src') || '').split('/').pop().replace('.png', '');
          img.alt = nome;
          img.className += ' bg-gray-100 border-4 border-dashed border-gray-300 p-4 text-xl font-bold text-gray-500';
        };
        window.addEventListener('error', aoFalhar, true);
        return () => window.removeEventListener('error', aoFalhar, true);
      }, []);
 
      // Lê a instrução automaticamente ao abrir cada pergunta
      useEffect(() => {
        if (gameState === 'PLAYING') {
          falarTexto(perguntaAtual.descricao);
        }
      }, [currentIndex, gameState]);
 
      return (
        <ForestBackground>
 
          {gameState === 'START' && (
            <CloudBox className="w-full max-w-xl animate-fade-in-up">
              {<div className="text-6xl mb-4">🌳🦉📚</div>}
              <h1 className="text-4xl md:text-5xl font-black text-[#B2D548] mb-4 drop-shadow-sm leading-tight">
                Aprendendo e se<br/>Divertindo!
              </h1>
              <p className="text-xl text-gray-500 font-medium mb-6">Vamos começar no nível fácil e subir de dificuldade!</p>
              <SeletorVoz />
              <button
                onClick={startGame}
                className="bg-gradient-to-b from-[#B2D548] to-[#9fc23d] hover:from-[#a3c63f] hover:to-[#8bb034] text-white font-extrabold text-3xl py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center mx-auto gap-3 border-b-4 border-green-700"
              >
                <IconPlay size={32} /> CLIQUE AQUI PARA COMEÇAR
              </button>
            </CloudBox>
          )}
 
          {gameState === 'PLAYING' && (
            <div className={`w-full ${perguntaAtual.type === 'esconde' ? 'max-w-5xl' : 'max-w-2xl'} flex flex-col items-center animate-fade-in-up`}>
              <div className="flex justify-between w-full mb-6 px-4">
                <div className="bg-white bg-opacity-90 px-6 py-2 rounded-full font-bold text-[#B2D548] shadow-md border-2 border-green-300 flex items-center gap-2">
                  <IconStar size={20} className="text-yellow-500" /> Nível: {perguntaAtual.nivel} ({currentIndex + 1}/{sequenciaDePerguntas.length})
                </div>
                <div className="bg-white bg-opacity-90 px-6 py-2 rounded-full font-black text-blue-600 shadow-md border-2 border-blue-300">
                  Pontos: {score}
                </div>
              </div>
 
              <CloudBox className="w-full">
                {perguntaAtual.icon && (
                  <div className="text-6xl mb-6 flex justify-center">
                    {perguntaAtual.icon.endsWith('.png')
                    ? <img src={perguntaAtual.icon} alt="" className="h-60 object-contain" />
                    : perguntaAtual.icon}
                  </div>
                )}
                <div className="bg-blue-50 border-4 border-blue-200 rounded-3xl py-8 px-6 mb-4 shadow-inner">
                  <h2 className="text-3xl md:text-4xl font-black text-blue-700 leading-tight">
                    {perguntaAtual.text}
                  </h2>
                </div>
 
                {/* Botão de áudio */}
                <div className="mb-8 flex justify-center">
                  <BotaoAudio texto={perguntaAtual.descricao} />
                </div>
 
                {perguntaAtual.type === 'ligue'
                  ? (<LigueQuestao
                      key={perguntaAtual.id}
                      pares={perguntaAtual.pares}
                      onConcluir={() => handleAnswer(perguntaAtual.correct)}
                    />)
                  : perguntaAtual.type === 'esconde'
                  ? (<CapivaraEscondida
                      imagem={perguntaAtual.imagem}
                      capivara={{ img: perguntaAtual.capivara.img, ...perguntaAtual.capivara.posicoes[posCapivara] }}
                      falsos={perguntaAtual.falsos}
                      onErrar={() => handleAnswer('errado')}
                      onAchar={acharCapivara}
                    />)
                  : (
                    <div className="flex flex-wrap justify-center gap-4">
                      {opcoes.map((opt, idx) => (
                        <button key={idx} onClick={() => handleAnswer(opt)} className={
                          opt.endsWith('.png')
                          ? 'transform transition hover:scale-110 active:scale-95 p-2'
                          : `font-extrabold text-3xl py-4 px-8 rounded-[2rem] shadow-md transform transition hover:-translate-y-1 active:translate-y-1 min-w-[140px] border-b-8 active:border-b-0 mt-2 active:mt-[10px] ${getButtonColor(opt, perguntaAtual.type)}`
                        }>
                          {opt.endsWith('.png')
                            ? (<div className="flex flex-col items-center gap-2">
                                <img src={opt} alt="" className="h-24 object-contain rounded-2xl" />
                                {['habitat', 'rima'].includes(perguntaAtual.type) && (
                                  <span className="font-extrabold text-xl text-blue-700">{nomeDaImagem(opt)}</span>
                                )}
                              </div>)
                            : opt}
                        </button>
                      ))}
                    </div>
                  )}
              </CloudBox>
            </div>
          )}
 
          {gameState === 'FEEDBACK' && (
            <CloudBox className={`w-full max-w-xl border-8 ${isCorrect ? 'border-green-400' : 'border-orange-400'} animate-bounce-slight`}>
              <div className="flex flex-col items-center">
                {isCorrect ? (
                  <div className="text-center w-full">
                    <div className="bg-[#B2D548] text-white p-6 rounded-full mb-6 flex justify-center mx-auto w-max"><IconCheck size={80} /></div>
                    <h2 className="text-5xl font-black text-[#B2D548] mb-4">Fantástico!</h2>
                    <p className="text-2xl text-[#FFFFFF] font-bold mb-8 bg-[#B2D548] px-6 py-3 rounded-2xl inline-block">+10 pontos!</p>
                    <button onClick={avancarPergunta} className="bg-blue-500 hover:bg-blue-600 text-white font-extrabold text-2xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center gap-3 border-b-4 border-blue-700 w-full">
                      {currentIndex + 1 < sequenciaDePerguntas.length ? 'Próxima' : 'Ver Resultado'} <IconArrowRight size={28} />
                    </button>
                  </div>
                ) : (
                  <div className="text-center w-full">
                    <div className="bg-orange-100 p-6 rounded-full mb-6 flex justify-center mx-auto w-max"><span className="text-7xl">🌟</span></div>
                    <h2 className="text-5xl font-black text-orange-500 mb-4">Quase lá!</h2>
                    <p className="text-xl text-orange-700 font-medium mb-8">Você é muito inteligente! Que tal tentar mais uma vez?</p>
                    <button onClick={tentarNovamente} className="bg-orange-400 hover:bg-orange-500 text-white font-extrabold text-2xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center gap-3 border-b-4 border-orange-600 w-full">
                      Tentar Novamente
                    </button>
                  </div>
                )}
              </div>
            </CloudBox>
          )}
 
          {gameState === 'LEVEL_UP' && (
            <CloudBox className="w-full max-w-xl text-center animate-fade-in-up border-8 border-blue-400">
              <div className="text-7xl mb-6 animate-bounce">🚀✨</div>
              <h2 className="text-5xl font-black text-blue-600 mb-4">Incrível!</h2>
              <p className="text-2xl text-blue-800 font-medium mb-8">
                Você subiu de nível! Agora vamos para o nível<br/>
                <span className="text-4xl font-black text-blue-700 bg-blue-100 px-6 py-2 rounded-2xl inline-block mt-4 border-2 border-blue-300 shadow-sm">
                  {sequenciaDePerguntas[currentIndex + 1]?.nivel}
                </span>
              </p>
              <button onClick={irParaProximoNivel} className="bg-gradient-to-b from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white font-extrabold text-3xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center mx-auto gap-3 border-b-4 border-blue-700 w-full md:w-auto">
                <IconPlay size={32} /> Continuar
              </button>
            </CloudBox>
          )}
 
          {gameState === 'END' && (
            <CloudBox className="w-full max-w-xl text-center animate-fade-in-up">
              <div className="flex justify-center mb-6 text-yellow-400 gap-2">
                <IconStar size={64} className="animate-bounce-slight" />
              </div>
              <h2 className="text-5xl font-black text-[#B2D548] mb-4">Fim de Jogo!</h2>
              <div className="bg-gradient-to-br from-yellow-100 to-yellow-300 rounded-[3rem] p-8 mb-8 border-4 border-yellow-400 shadow-inner inline-block w-full">
                <p className="text-yellow-800 font-bold mb-2 text-xl tracking-wider">A SUA PONTUAÇÃO</p>
                <p className="text-7xl font-black text-yellow-600 drop-shadow-md">{score}</p>
              </div>
              <button onClick={startGame} className="bg-[#B2D548] hover:bg-[#B2D548] text-white font-extrabold text-2xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center mx-auto gap-3 border-b-4 border-green-700 w-full md:w-auto">
                <IconRestart size={28} /> Jogar Novamente
              </button>
            </CloudBox>
          )}
 
        </ForestBackground>
      );
    }
 
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

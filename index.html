<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendendo e se Divertindo!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    .animate-bounce-slight { animation: bounceSlight 1s infinite; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounceSlight {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect } = React;

    // --- Ícones SVG embutidos ---
    const IconCloud = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M17.5 19c2.5 0 4.5-2 4.5-4.5S20 10 17.5 10c-.1 0-.3 0-.4 0A7.5 7.5 0 0 0 3.2 13a4.5 4.5 0 0 0 1.3 8.8h13z"/></svg>;
    const IconTree = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22v-8"/><path d="M6 10a4 4 0 0 1-4-4 4 4 0 0 1 4-4 4 4 0 0 1 4 4 4 4 0 0 1 4-4 4 4 0 0 1 4 4 4 4 0 0 1-4 4"/></svg>;
    const IconPlay = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>;
    const IconStar = ({ size = 24, className = '' }) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
    const IconArrowRight = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
    const IconCheck = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const IconRestart = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v6h6"/><path d="M3 13a9 9 0 1 0 3-7.7L3 8"/></svg>;

    // --- Sequência Progressiva de Perguntas ---
    const sequenciaDePerguntas = [
      // FÁCIL
      { id: 1, nivel: 'Fácil', type: 'syllable', text: 'VA - ___', options: ['CA', 'CO'], correct: 'CA', icon: '🐄' },
      { id: 2, nivel: 'Fácil', type: 'syllable', text: 'RA - ___', options: ['TO', 'TU'], correct: 'TO', icon: '🐭' },
      { id: 3, nivel: 'Fácil', type: 'syllable', text: 'SA - ___', options: ['PE', 'PO'], correct: 'PO', icon: '🐸' },
      { id: 4, nivel: 'Fácil', type: 'color', text: 'Qual objeto é o AMARELO?', options: ['Sol', 'Céu', 'Sapo'], correct: 'Sol', icon: '🎨' },
      { id: 5, nivel: 'Fácil', type: 'color', text: 'Qual objeto é o VERDE?', options: ['Sol', 'Céu', 'Sapo'], correct: 'Sapo', icon: '🎨' },
      { id: 6, nivel: 'Fácil', type: 'color', text: 'Qual objeto é o AZUL?', options: ['Céu', 'Sapo', 'Sol'], correct: 'Céu', icon: '🎨' },
      { id: 7, nivel: 'Fácil', type: 'habitat', text: 'Onde o Sapo mora?', options: ['Lagoa', 'Colmeia', 'Deserto'], correct: 'Lagoa', icon: '🐸' },
      { id: 8, nivel: 'Fácil', type: 'habitat', text: 'Onde a Abelha mora?', options: ['Colmeia', 'Lagoa', 'Deserto'], correct: 'Colmeia', icon: '🐝' },
      
      // MÉDIO
      { id: 10, nivel: 'Médio', type: 'syllable', text: 'SA - PA - ___', options: ['TO', 'TA', 'TE'], correct: 'TO', icon: '👞' },
      { id: 11, nivel: 'Médio', type: 'syllable', text: 'CA - SA - ___', options: ['CA', 'CO', 'CU'], correct: 'CO', icon: '🧥' },
      { id: 12, nivel: 'Médio', type: 'syllable', text: 'TA - PE - ___', options: ['TA', 'TI', 'TE'], correct: 'TE', icon: '🛋️' },
      { id: 14, nivel: 'Médio', type: 'rima', text: 'O que rima com SABÃO?', options: ['BALÃO', 'TELHA', 'CASA'], correct: 'BALÃO', icon: '🫧' },
      
      // DIFÍCIL
      { id: 22, nivel: 'Difícil', type: 'syllable', text: 'E - LE - FAN - ___', options: ['TE', 'TA', 'TI', 'TU'], correct: 'TE', icon: '🐘' },
      { id: 23, nivel: 'Difícil', type: 'syllable', text: 'BI - CI - CLE - ___', options: ['TA', 'BA', 'BE', 'BO'], correct: 'TA', icon: '🚲' },
      
      // EXPERT
      { id: 27, nivel: 'Expert', type: 'syllable', text: 'PA - RA - LE - LE - PÍ - PE - ___', options: ['DO', 'PE-DA', 'PI-DA', 'PO-DO'], correct: 'DO', icon: '🧱' }
    ];

    const ForestBackground = ({ children }) => (
    <div
      className="min-h-screen relative overflow-hidden flex flex-col items-center justify-center p-4 font-sans selection:bg-green-300"
      style={{
        backgroundImage: "url('Background.png')",
        backgroundSize: 'cover',
        backgroundPosition: 'center',
        backgroundRepeat: 'no-repeat'
      }}
    >
      <div className="relative z-10 w-full max-w-3xl flex justify-center">{children}</div>
    </div>
    );

    const CloudBox = ({ children, className = '' }) => (
      <div className={`bg-white rounded-[3rem] p-8 md:p-12 shadow-2xl border-8 border-white bg-opacity-95 text-center relative ${className}`}>
        {children}
      </div>
    );

    function App() {
      // Estados possíveis: 'START', 'PLAYING', 'FEEDBACK', 'LEVEL_UP', 'END'
      const [gameState, setGameState] = useState('START'); 
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [isCorrect, setIsCorrect] = useState(false);

      const startGame = () => {
        setCurrentIndex(0);
        setScore(0);
        setGameState('PLAYING');
      };

      const handleAnswer = (option) => {
        const correct = option === sequenciaDePerguntas[currentIndex].correct;
        setIsCorrect(correct);
        if (correct) setScore(prev => prev + 10);
        setGameState('FEEDBACK');
      };

      const tentarNovamente = () => {
        setGameState('PLAYING');
      };

      const avancarPergunta = () => {
        if (currentIndex + 1 < sequenciaDePerguntas.length) {
          const nivelAtual = sequenciaDePerguntas[currentIndex].nivel;
          const proximoNivel = sequenciaDePerguntas[currentIndex + 1].nivel;
          
          if (nivelAtual !== proximoNivel) {
            setGameState('LEVEL_UP');
          } else {
            setCurrentIndex(prev => prev + 1);
            setGameState('PLAYING');
          }
        } else {
          setGameState('END');
        }
      };

      const irParaProximoNivel = () => {
        setCurrentIndex(prev => prev + 1);
        setGameState('PLAYING');
      };

      const getButtonColor = (option, type) => {
        if (type === 'color') {
          switch (option.toLowerCase()) {
            case 'sol': return 'bg-yellow-400 hover:bg-yellow-500 border-yellow-500 text-yellow-900';
            case 'céu': return 'bg-blue-500 hover:bg-blue-600 border-blue-600 text-white';
            case 'sapo': return 'bg-green-500 hover:bg-green-600 border-green-600 text-white';
          }
        }
        return 'bg-purple-400 hover:bg-purple-500 border-purple-500 text-white';
      };

      const perguntaAtual = sequenciaDePerguntas[currentIndex];

      return (
        <ForestBackground>
          
          {gameState === 'START' && (
            <CloudBox className="w-full max-w-xl animate-fade-in-up">
              <!-- <div className="text-6xl mb-4">🌳🦉✨</div> --!>
              <h1 className="text-4xl md:text-5xl font-black text-green-600 mb-4 drop-shadow-sm leading-tight">
                Aprendendo e se<br/>Divertindo!
              </h1>
              <p className="text-xl text-gray-500 font-medium mb-8">Vamos começar no nível fácil e subir de dificuldade!</p>
              <button 
                onClick={startGame}
                className="bg-gradient-to-b from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white font-extrabold text-3xl py-4 px-12 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center mx-auto gap-3 border-b-4 border-green-700"
              >
                <IconPlay size={32} /> CLIQUE AQUI PARA COMEÇAR
              </button>
            </CloudBox>
          )}

          {gameState === 'PLAYING' && (
            <div className="w-full max-w-2xl flex flex-col items-center animate-fade-in-up">
              <div className="flex justify-between w-full mb-6 px-4">
                <div className="bg-white bg-opacity-90 px-6 py-2 rounded-full font-bold text-green-700 shadow-md border-2 border-green-300 flex items-center gap-2">
                  <IconStar size={20} className="text-yellow-500" /> Nível: {perguntaAtual.nivel} ({currentIndex + 1}/{sequenciaDePerguntas.length})
                </div>
                <div className="bg-white bg-opacity-90 px-6 py-2 rounded-full font-black text-blue-600 shadow-md border-2 border-blue-300">
                  Pontos: {score}
                </div>
              </div>

              <CloudBox className="w-full">
                <div className="text-6xl mb-6">{perguntaAtual.icon}</div>
                <div className="bg-blue-50 border-4 border-blue-200 rounded-3xl py-8 px-6 mb-8 shadow-inner">
                  <h2 className="text-3xl md:text-4xl font-black text-blue-700 leading-tight">
                    {perguntaAtual.text}
                  </h2>
                </div>
                <div className="flex flex-wrap justify-center gap-4">
                  {perguntaAtual.options.map((opt, idx) => (
                    <button key={idx} onClick={() => handleAnswer(opt)} className={`font-extrabold text-3xl py-4 px-8 rounded-[2rem] shadow-md transform transition hover:-translate-y-1 active:translate-y-1 min-w-[140px] border-b-8 active:border-b-0 mt-2 active:mt-[10px] ${getButtonColor(opt, perguntaAtual.type)}`}>
                      {opt}
                    </button>
                  ))}
                </div>
              </CloudBox>
            </div>
          )}

          {gameState === 'FEEDBACK' && (
            <CloudBox className={`w-full max-w-xl border-8 ${isCorrect ? 'border-green-400' : 'border-orange-400'} animate-bounce-slight`}>
              <div className="flex flex-col items-center">
                {isCorrect ? (
                  <div className="text-center w-full">
                    <div className="bg-green-100 p-6 rounded-full mb-6 flex justify-center mx-auto w-max"><IconCheck size={80} className="text-green-500" /></div>
                    <h2 className="text-5xl font-black text-green-600 mb-4">Fantástico!</h2>
                    <p className="text-2xl text-green-800 font-bold mb-8 bg-green-50 px-6 py-3 rounded-2xl inline-block">+10 pontos!</p>
                    <button onClick={avancarPergunta} className="bg-blue-500 hover:bg-blue-600 text-white font-extrabold text-2xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center gap-3 border-b-4 border-blue-700 w-full">
                      {currentIndex + 1 < sequenciaDePerguntas.length ? 'Próxima' : 'Ver Resultado'} <IconArrowRight size={28} />
                    </button>
                  </div>
                ) : (
                  <div className="text-center w-full">
                    <div className="bg-orange-100 p-6 rounded-full mb-6 flex justify-center mx-auto w-max"><span className="text-7xl">🌟</span></div>
                    <h2 className="text-5xl font-black text-orange-500 mb-4">Quase lá!</h2>
                    <p className="text-xl text-orange-700 font-medium mb-8">Você é muito inteligente! Que tal tentar mais uma vez?</p>
                    <button onClick={tentarNovamente} className="bg-orange-400 hover:bg-orange-500 text-white font-extrabold text-2xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center gap-3 border-b-4 border-orange-600 w-full">
                      Tentar Novamente
                    </button>
                  </div>
                )}
              </div>
            </CloudBox>
          )}

          {gameState === 'LEVEL_UP' && (
            <CloudBox className="w-full max-w-xl text-center animate-fade-in-up border-8 border-blue-400">
              <div className="text-7xl mb-6 animate-bounce">🚀✨</div>
              <h2 className="text-5xl font-black text-blue-600 mb-4">Incrível!</h2>
              <p className="text-2xl text-blue-800 font-medium mb-8">
                Subiste de nível! Agora vamos para o nível<br/>
                <span className="text-4xl font-black text-blue-700 bg-blue-100 px-6 py-2 rounded-2xl inline-block mt-4 border-2 border-blue-300 shadow-sm">
                  {sequenciaDePerguntas[currentIndex + 1]?.nivel}
                </span>
              </p>
              <button onClick={irParaProximoNivel} className="bg-gradient-to-b from-blue-400 to-blue-600 hover:from-blue-500 hover:to-blue-700 text-white font-extrabold text-3xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 flex items-center justify-center mx-auto gap-3 border-b-4 border-blue-700 w-full md:w-auto">
                <IconPlay size={32} /> Continuar
              </button>
            </CloudBox>
          )}

          {gameState === 'END' && (
            <CloudBox className="w-full max-w-xl text-center animate-fade-in-up">
              <div className="flex justify-center mb-6 text-yellow-400 gap-2">
                <IconStar size={64} className="animate-bounce-slight" />
              </div>
              <h2 className="text-5xl font-black text-green-600 mb-4">Fim de Jogo!</h2>
              <div className="bg-gradient-to-br from-yellow-100 to-yellow-300 rounded-[3rem] p-8 mb-8 border-4 border-yellow-400 shadow-inner inline-block w-full">
                <p className="text-yellow-800 font-bold mb-2 text-xl tracking-wider">A TUA PONTUAÇÃO</p>
                <p className="text-7xl font-black text-yellow-600 drop-shadow-md">{score}</p>
              </div>
              <button onClick={startGame} className="bg-green-500 hover:bg-green-600 text-white font-extrabold text-2xl py-4 px-10 rounded-full shadow-lg transform transition hover:scale-105 flex items-center justify-center mx-auto gap-3 border-b-4 border-green-700 w-full md:w-auto">
                <IconRestart size={28} /> Jogar Novamente
              </button>
            </CloudBox>
          )}
          
        </ForestBackground>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
